name: legacy-apk

# Legacy channel: one APK for Android 5.0–7.1 (API 21+).
#
# Every push to `legacy` builds and publishes a prerelease tagged
# `legacy-latest`, which is where the legacy app checks for updates from.
# It is a prerelease on purpose: `releases/latest` (and the normal app's
# latest.json) must keep pointing at the main release.

on:
  push:
    branches: [legacy]
    tags: ["legacy-v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: legacy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Android APK (API 21)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-35 build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Prepare signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/pocketdesk.p12"
            {
              echo "POCKETDESK_KEYSTORE=$RUNNER_TEMP/pocketdesk.p12"
              echo "POCKETDESK_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD"
              echo "POCKETDESK_KEY_ALIAS=$KEY_ALIAS"
              echo "POCKETDESK_KEY_PASSWORD=$KEY_PASSWORD"
            } >> "$GITHUB_ENV"
            echo "Release keystore ready."
          else
            echo "::warning::No ANDROID_KEYSTORE_BASE64 secret — falling back to the debug key."
          fi

      - name: Build APKs
        working-directory: android
        run: |
          version_name="dev-${GITHUB_RUN_NUMBER}"
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            version_name="${GITHUB_REF_NAME#legacy-v}-legacy"
          fi
          echo "POCKETDESK_VERSION_NAME=$version_name" >> "$GITHUB_ENV"
          gradle --no-daemon assembleDebug assembleRelease \
            -PpocketdeskVersionName="${version_name}" \
            -PpocketdeskVersionCode="${GITHUB_RUN_NUMBER}"

      - name: Verify release signature
        shell: bash
        run: |
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --print-certs android/app/build/outputs/apk/release/app-release.apk | tee certs.txt
          if ! grep -q "CN=PocketDesk" certs.txt; then
            echo "::error::Release APK is not signed with the PocketDesk update key."
            exit 1
          fi
          grep "SHA-256 digest" certs.txt | head -1 | sed 's/.*: //' > android-cert-sha256.txt

      - name: Check the minimum SDK really is 21
        shell: bash
        run: |
          AAPT=$(ls "$ANDROID_HOME"/build-tools/*/aapt | sort -V | tail -1)
          "$AAPT" dump badging android/app/build/outputs/apk/release/app-release.apk \
            | grep -E "^package:|sdkVersion|targetSdkVersion" | tee badging.txt
          grep -q "sdkVersion:'21'" badging.txt || {
            echo "::error::Legacy APK does not install on Android 5.0+"
            exit 1
          }

      - name: Collect APKs
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/debug/app-debug.apk out/pocketdesk-legacy-debug.apk
          cp android/app/build/outputs/apk/release/app-release.apk out/pocketdesk-legacy.apk
          cp android-cert-sha256.txt out/
          size=$(stat -c %s out/pocketdesk-legacy.apk)
          sha=$(sha256sum out/pocketdesk-legacy.apk | cut -d' ' -f1)
          cat > out/latest-legacy.json <<JSON
          {"version":"${POCKETDESK_VERSION_NAME}","versionCode":${GITHUB_RUN_NUMBER},"apk":"pocketdesk-legacy.apk","size":${size},"sha256":"${sha}"}
          JSON
          (cd out && sha256sum pocketdesk-legacy.apk > SHA256SUMS.txt)
          rm -f badging.txt certs.txt
          ls -lh out
          cat out/latest-legacy.json

      - uses: actions/upload-artifact@v4
        with:
          name: pocketdesk-legacy
          path: out/*
          if-no-files-found: error

      - name: Publish legacy prerelease
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view legacy-latest >/dev/null 2>&1 || \
            gh release create legacy-latest \
              --prerelease \
              --title "PocketDesk Legacy (Android 5.0+)" \
              --notes "Legacy build for Android 5.0–7.1. Signed with the same update key as the main app, but it is a separate package (dev.pocketdesk.legacy), so it can be installed next to the normal app."
          # Keep this release a prerelease so `releases/latest` stays on main.
          gh release edit legacy-latest \
            --prerelease \
            --latest=false \
            --title "PocketDesk Legacy (Android 5.0+)" \
            --notes-file .github/legacy-release-notes.md
          gh release upload legacy-latest out/* --clobber
