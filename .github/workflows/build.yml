name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-35 build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Prepare signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/pocketdesk.p12"
            {
              echo "POCKETDESK_KEYSTORE=$RUNNER_TEMP/pocketdesk.p12"
              echo "POCKETDESK_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD"
              echo "POCKETDESK_KEY_ALIAS=$KEY_ALIAS"
              echo "POCKETDESK_KEY_PASSWORD=$KEY_PASSWORD"
            } >> "$GITHUB_ENV"
            echo "Release keystore ready."
          else
            echo "::warning::No ANDROID_KEYSTORE_BASE64 secret — falling back to the debug key."
          fi

      - name: Build APKs
        working-directory: android
        run: |
          version_name="${GITHUB_REF_NAME#v}"
          if [ "${GITHUB_REF_TYPE}" != "tag" ]; then version_name="dev-${GITHUB_RUN_NUMBER}"; fi
          gradle --no-daemon assembleDebug assembleRelease \
            -PpocketdeskVersionName="${version_name}" \
            -PpocketdeskVersionCode="${GITHUB_RUN_NUMBER}"

      - name: Verify release signature
        if: github.ref_type == 'tag'
        shell: bash
        run: |
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --print-certs android/app/build/outputs/apk/release/app-release.apk | tee certs.txt
          if ! grep -q "CN=PocketDesk" certs.txt; then
            echo "::error::Release APK is not signed with the PocketDesk update key."
            exit 1
          fi
          # Updates only install if the certificate is identical, so publish the
          # digest next to the APK for people who verify by hand.
          grep "SHA-256 digest" certs.txt | head -1 | sed 's/.*: //' > android-cert-sha256.txt

      - name: Collect APKs
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/debug/app-debug.apk out/pocketdesk-debug.apk
          cp android/app/build/outputs/apk/release/app-release.apk out/pocketdesk.apk
          if [ -f android-cert-sha256.txt ]; then cp android-cert-sha256.txt out/; fi
          ls -lh out

      - uses: actions/upload-artifact@v4
        with:
          name: pocketdesk-android
          path: out/*
          if-no-files-found: error

  host:
    name: Host (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            os: ubuntu-latest
          - name: windows-x86_64
            os: windows-latest
          - name: macos-arm64
            os: macos-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: host

      - name: Build
        working-directory: host
        run: cargo build --release --locked

      - name: Test
        working-directory: host
        run: cargo test --locked

      - name: Package
        shell: bash
        run: |
          mkdir -p out stage
          case "${{ matrix.name }}" in
            linux-*)
              mkdir -p "stage/pocketdesk-${{ matrix.name }}"
              cp host/target/release/pocketdesk "stage/pocketdesk-${{ matrix.name }}/pocketdesk"
              cp scripts/setup-linux-input.sh "stage/pocketdesk-${{ matrix.name }}/"
              cp README.md "stage/pocketdesk-${{ matrix.name }}/README.md"
              tar -C stage -czf "out/pocketdesk-${{ matrix.name }}.tar.gz" "pocketdesk-${{ matrix.name }}"
              ;;
            windows-*)
              cp host/target/release/pocketdesk.exe "out/pocketdesk-${{ matrix.name }}.exe"
              ;;
            macos-*)
              cp host/target/release/pocketdesk "out/pocketdesk-${{ matrix.name }}"
              ;;
          esac
          ls -lh out

      - uses: actions/upload-artifact@v4
        with:
          name: pocketdesk-${{ matrix.name }}
          path: out/*
          if-no-files-found: error

  release:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [android, host]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Checksums and update manifest
        run: |
          cd dist
          # In-app updates read this; it is public, so it carries no secrets.
          apk_sha=$(sha256sum pocketdesk.apk | cut -d' ' -f1)
          apk_size=$(stat -c%s pocketdesk.apk)
          version="${GITHUB_REF_NAME#v}"
          printf '{"version":"%s","versionCode":%s,"apk":"pocketdesk.apk","size":%s,"sha256":"%s"}\n' \
            "$version" "${GITHUB_RUN_NUMBER}" "$apk_size" "$apk_sha" > latest.json
          cat latest.json
          sha256sum ./* > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          body: |
            PocketDesk ${{ github.ref_name }}

            **Input modes** — choose direct touch (tap where you look) or a real
            touchpad: drag to move, tap to click, hold to drag, two fingers to scroll,
            two-finger tap for right click, three-finger tap for middle click. Tap to
            click, natural scrolling and pointer speed are configurable.

            **Audio to the phone** — ⋯ → Audio output streams this machine's sound to the
            phone (PCM 48 kHz stereo) over a separate socket, so it keeps playing in the
            background. The host's own speakers can be muted while the phone listens, and
            are always restored when the session ends.

            **Fill screen** — crop the sides in mirroring instead of showing black bars.

            **Stop really stops** — the foreground notification is now removed when the
            session ends.

            **Updates** — this release is the first signed with the permanent update key.
            Older installs were signed with a throwaway CI key, so **uninstall once** and
            install this APK by hand. After that, the app updates itself:
            **⋯ → Check for updates** (also checked on launch) downloads, verifies the
            SHA-256 and signing certificate, and opens the installer.

            **Faster** — unchanged frames are no longer sent (~0.4 Mbit/s idle instead of
            ~17), the stream pauses entirely while the app is in the background, decoded
            bitmaps are reused, and quality steps down automatically if the phone falls
            behind.

            **Pairing** — run the host and scan the QR code it prints, or type the 8-character
            code (`K7M4-QX2B`). Tick *Remember this device* for one-tap reconnects, or leave it
            unticked for a one-time login.

            **Background** — the session keeps running when the app is swiped out of recents.
            The notification shows the live fps and its **Stop** action asks for confirmation.

            **Quality** — the toolbar's **⋯** menu has four presets (Low data 10 fps/q45,
            Balanced, Sharp, Smooth 30 fps). The host reconfigures live and confirms what it applied.

            **Keys & full screen** — choose which modifiers, navigation keys and F-keys appear in the
            toolbar; hide it entirely for a full-screen view and bring it back with the ☰ tab.

            **Second screen** — **⋯ → Use phone as a second screen** asks the host for a Hyprland
            headless monitor sized to your phone (1600x720 for a 20:9 display), so it extends the
            desktop instead of mirroring it. Removed automatically when you disconnect.

            **Android** — `pocketdesk.apk` (sideload it). `pocketdesk-debug.apk` is the same app with the debug key.

            **Linux** — `pocketdesk-linux-x86_64.tar.gz`, unpack and run `./pocketdesk`.
            First run prints a pairing code and QR; `sudo ./setup-linux-input.sh` enables remote mouse/keyboard.
            `./pocketdesk --extend 1600x900` starts in second-screen mode.

            **Windows / macOS** — binaries are built and stream screens through ffmpeg, but remote input is
            not implemented yet. Treat them as previews (see the roadmap).

            Verify downloads with `SHA256SUMS.txt`.
