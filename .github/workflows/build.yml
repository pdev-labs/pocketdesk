name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-35 build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build APKs
        working-directory: android
        run: |
          version_name="${GITHUB_REF_NAME#v}"
          if [ "${GITHUB_REF_TYPE}" != "tag" ]; then version_name="0.1.0-dev"; fi
          gradle --no-daemon assembleDebug assembleRelease \
            -PpocketdeskVersionName="${version_name}" \
            -PpocketdeskVersionCode="${GITHUB_RUN_NUMBER}"

      - name: Collect APKs
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/debug/app-debug.apk out/pocketdesk-debug.apk
          cp android/app/build/outputs/apk/release/app-release.apk out/pocketdesk.apk
          ls -lh out

      - uses: actions/upload-artifact@v4
        with:
          name: pocketdesk-android
          path: out/*.apk
          if-no-files-found: error

  host:
    name: Host (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            os: ubuntu-latest
          - name: windows-x86_64
            os: windows-latest
          - name: macos-arm64
            os: macos-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: host

      - name: Build
        working-directory: host
        run: cargo build --release --locked

      - name: Test
        working-directory: host
        run: cargo test --locked

      - name: Package
        shell: bash
        run: |
          mkdir -p out stage
          case "${{ matrix.name }}" in
            linux-*)
              mkdir -p "stage/pocketdesk-${{ matrix.name }}"
              cp host/target/release/pocketdesk "stage/pocketdesk-${{ matrix.name }}/pocketdesk"
              cp scripts/setup-linux-input.sh "stage/pocketdesk-${{ matrix.name }}/"
              cp README.md "stage/pocketdesk-${{ matrix.name }}/README.md"
              tar -C stage -czf "out/pocketdesk-${{ matrix.name }}.tar.gz" "pocketdesk-${{ matrix.name }}"
              ;;
            windows-*)
              cp host/target/release/pocketdesk.exe "out/pocketdesk-${{ matrix.name }}.exe"
              ;;
            macos-*)
              cp host/target/release/pocketdesk "out/pocketdesk-${{ matrix.name }}"
              ;;
          esac
          ls -lh out

      - uses: actions/upload-artifact@v4
        with:
          name: pocketdesk-${{ matrix.name }}
          path: out/*
          if-no-files-found: error

  release:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [android, host]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Checksums
        run: |
          cd dist
          sha256sum ./* > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          body: |
            PocketDesk ${{ github.ref_name }}

            **Android** — `pocketdesk.apk` (sideload it). `pocketdesk-debug.apk` is the same app with the debug key.

            **Linux** — `pocketdesk-linux-x86_64.tar.gz`, unpack and run `./pocketdesk`.
            First run prints a pairing token; `sudo ./setup-linux-input.sh` enables remote mouse/keyboard.

            **Windows / macOS** — binaries are built and stream screens through ffmpeg, but remote input is
            not implemented yet in v0.1. Treat them as previews (see the roadmap).

            Verify downloads with `SHA256SUMS.txt`.
