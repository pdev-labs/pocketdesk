[package]
name = "pocketdesk"
version = "0.5.4"
edition = "2021"
rust-version = "1.80"
license = "MIT"
description = "Stream your desktop to your phone, and drive it from the couch."
repository = "https://github.com/pdev-labs/pocketdesk"
readme = "../README.md"

[[bin]]
name = "pocketdesk"
path = "src/main.rs"

[dependencies]
anyhow = "1"
axum = { version = "0.8", features = ["ws"] }
bytes = "1"
clap = { version = "4", features = ["derive", "env"] }
jpeg-encoder = "0.6"
qrcode = "0.14"
rand = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
subtle = "2"
tokio = { version = "1", features = [
    "rt-multi-thread",
    "macros",
    "net",
    "sync",
    "time",
    "signal",
    "process",
] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"

[dev-dependencies]
rqrr = "0.10"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
